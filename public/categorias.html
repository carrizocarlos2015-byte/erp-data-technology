<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP - Gestión de Categorías</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .menu-nav { background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%); padding: 10px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.15); position: sticky; top: 0; z-index: 1000; }
    .menu-nav .logo { color: white; font-weight: bold; font-size: 1.2rem; text-decoration: none; }
    .menu-nav .nav-link { color: rgba(255,255,255,0.85); font-weight: 500; padding: 8px 16px; border-radius: 8px; transition: all 0.2s; text-decoration: none; display: flex; align-items: center; gap: 6px; }
    .menu-nav .nav-link:hover { background: rgba(255,255,255,0.15); color: white; }
    .menu-nav .nav-link.active { background: white; color: #0d6efd; }
    .menu-nav .nav-link i { font-size: 1.1rem; }
    @media (max-width: 767px) { .menu-nav .nav-link span { display: none; } .menu-nav .nav-link { padding: 8px 10px; } }
    .card { border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
    .categoria-item { border: 1px solid #dee2e6; border-radius: 8px; padding: 15px; margin-bottom: 10px; background: white; }
    .categoria-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .categoria-nombre { font-weight: bold; font-size: 1.1rem; }
    .subcategoria-list { margin-left: 20px; margin-top: 10px; }
    .subcategoria-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #f0f0f0; }
    .subcategoria-item:last-child { border-bottom: none; }
    .badge-count { background: #6c757d; color: white; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; }
    .btn-accion { padding: 4px 8px; font-size: 0.85rem; margin: 0 2px; }
    .btn-editar { background-color: #0d6efd; color: white; }
    .btn-eliminar { background-color: #dc3545; color: white; }
    .btn-agregar { background-color: #198754; color: white; }
    .fab-button { position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px; border-radius: 50%; background: #0d6efd; color: white; border: none; box-shadow: 0 4px 12px rgba(13,110,253,0.4); font-size: 1.5rem; display: flex; align-items: center; justify-content: center; z-index: 1000; }
  </style>
</head>
<body>

  <nav class="menu-nav">
    <div class="container-fluid px-3">
      <div class="d-flex align-items-center justify-content-between flex-wrap">
        <a href="index.html" class="logo me-3"><i class="bi bi-building"></i> ERP Data Technology</a>
        <div class="d-flex flex-wrap gap-1">
          <a href="index.html" class="nav-link"><i class="bi bi-house"></i> <span>Inicio</span></a>
          <a href="clientes.html" class="nav-link"><i class="bi bi-people"></i> <span>Clientes</span></a>
          <a href="cuenta-corriente.html" class="nav-link"><i class="bi bi-wallet2"></i> <span>Cta. Cte.</span></a>
          <a href="finanzas.html" class="nav-link"><i class="bi bi-cash-stack"></i> <span>Finanzas</span></a>
          <a href="categorias.html" class="nav-link active"><i class="bi bi-tags"></i> <span>Categorías</span></a>
          <a href="cheques.html" class="nav-link"><i class="bi bi-receipt"></i> <span>Cheques</span></a>
          <a href="trabajos.html" class="nav-link"><i class="bi bi-tools"></i> <span>Trabajos</span></a>
          <a href="agenda.html" class="nav-link"><i class="bi bi-calendar-event"></i> <span>Agenda</span></a>
          <a href="reportes.html" class="nav-link"><i class="bi bi-file-pdf"></i> <span>Reportes</span></a>
          <a href="empresa.html" class="nav-link"><i class="bi bi-building-gear"></i> <span>Empresa</span></a>
          <a href="presupuestos.html" class="nav-link"><i class="bi bi-pc-display"></i> <span>PC Builder</span></a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-3 py-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="fw-bold mb-0"><i class="bi bi-tags"></i> Gestión de Categorías y Subcategorías</h4>
      <button class="btn btn-primary" onclick="abrirModalCategoria()"><i class="bi bi-plus-lg"></i> Nueva Categoría</button>
    </div>

    <div id="listaCategorias">
      <div class="text-center py-4 text-muted">Cargando categorías...</div>
    </div>
  </div>

  <!-- Modal: Nueva/Editar Categoría -->
  <div class="modal fade" id="modalCategoria" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title" id="modalCategoriaTitulo"><i class="bi bi-plus-lg"></i> Nueva Categoría</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formCategoria">
            <input type="hidden" id="categoriaId">
            <div class="mb-3">
              <label class="form-label fw-bold">Nombre *</label>
              <input type="text" class="form-control" id="categoriaNombre" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Icono (emoji o clase Bootstrap)</label>
              <input type="text" class="form-control" id="categoriaIcono" placeholder="Ej:  o bi-cash">
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Color (hex)</label>
              <input type="color" class="form-control" id="categoriaColor" value="#0d6efd">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" onclick="guardarCategoria()"><i class="bi bi-save"></i> Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Nueva Subcategoría -->
  <div class="modal fade" id="modalSubcategoria" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title" id="modalSubcategoriaTitulo"><i class="bi bi-plus-lg"></i> Nueva Subcategoría</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formSubcategoria">
            <input type="hidden" id="subcategoriaId">
            <input type="hidden" id="subcategoriaCategoriaId">
            <div class="mb-3">
              <label class="form-label fw-bold">Nombre *</label>
              <input type="text" class="form-control" id="subcategoriaNombre" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Icono (emoji o clase Bootstrap)</label>
              <input type="text" class="form-control" id="subcategoriaIcono" placeholder="Ej: 🏪 o bi-shop">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-success" onclick="guardarSubcategoria()"><i class="bi bi-save"></i> Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_URL = '/api/finanzas';
    let categoriasGlobal = [];

    document.addEventListener('DOMContentLoaded', cargarCategorias);

    async function cargarCategorias() {
      try {
        const response = await fetch(`${API_URL}/categorias-gestion`);
        categoriasGlobal = await response.json();
        renderizarCategorias();
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('listaCategorias').innerHTML = '<div class="alert alert-danger">Error al cargar categorías</div>';
      }
    }

    function renderizarCategorias() {
      const contenedor = document.getElementById('listaCategorias');
      if (categoriasGlobal.length === 0) {
        contenedor.innerHTML = '<div class="text-center py-4 text-muted">No hay categorías</div>';
        return;
      }

      let html = '';
      categoriasGlobal.forEach(cat => {
        html += `
          <div class="categoria-item">
            <div class="categoria-header">
              <div>
                <span class="categoria-nombre">${cat.icono || '📁'} ${cat.nombre}</span>
                <span class="badge-count ms-2">${cat.cantidad_movimientos} mov.</span>
              </div>
              <div>
                <button class="btn btn-sm btn-agregar" onclick="abrirModalSubcategoria('${cat.id}', '${cat.nombre}')">
                  <i class="bi bi-plus-lg"></i> Subcategoría
                </button>
                <button class="btn btn-sm btn-editar" onclick="editarCategoria('${cat.id}')">
                  <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-sm btn-eliminar" onclick="eliminarCategoria('${cat.id}')">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </div>
            ${cat.subcategorias && cat.subcategorias.length > 0 ? `
              <div class="subcategoria-list">
                ${cat.subcategorias.map(sub => `
                  <div class="subcategoria-item">
                    <div>
                      <span>${sub.icono || '📌'} ${sub.nombre}</span>
                      <span class="badge-count ms-2">${sub.cantidad_movimientos} mov.</span>
                    </div>
                    <div>
                      <button class="btn btn-sm btn-editar" onclick="editarSubcategoria('${sub.id}', '${sub.nombre}', '${sub.icono || ''}')">
                        <i class="bi bi-pencil"></i>
                      </button>
                      <button class="btn btn-sm btn-eliminar" onclick="eliminarSubcategoria('${sub.id}')">
                        <i class="bi bi-trash"></i>
                      </button>
                    </div>
                  </div>
                `).join('')}
              </div>
            ` : '<div class="text-muted ms-3"><small>Sin subcategorías</small></div>'}
          </div>
        `;
      });
      contenedor.innerHTML = html;
    }

    function abrirModalCategoria() {
      document.getElementById('formCategoria').reset();
      document.getElementById('categoriaId').value = '';
      document.getElementById('modalCategoriaTitulo').innerHTML = '<i class="bi bi-plus-lg"></i> Nueva Categoría';
      new bootstrap.Modal(document.getElementById('modalCategoria')).show();
    }

    function editarCategoria(id) {
      const cat = categoriasGlobal.find(c => c.id === id);
      if (!cat) return;
      document.getElementById('categoriaId').value = cat.id;
      document.getElementById('categoriaNombre').value = cat.nombre;
      document.getElementById('categoriaIcono').value = cat.icono || '';
      document.getElementById('categoriaColor').value = cat.color_hex || '#0d6efd';
      document.getElementById('modalCategoriaTitulo').innerHTML = '<i class="bi bi-pencil"></i> Editar Categoría';
      new bootstrap.Modal(document.getElementById('modalCategoria')).show();
    }

    async function guardarCategoria() {
      const id = document.getElementById('categoriaId').value;
      const nombre = document.getElementById('categoriaNombre').value.trim();
      if (!nombre) { alert('El nombre es obligatorio'); return; }
      
      const datos = {
        nombre: nombre,
        icono: document.getElementById('categoriaIcono').value.trim(),
        color_hex: document.getElementById('categoriaColor').value
      };

      try {
        let response;
        if (id) {
          response = await fetch(`${API_URL}/categorias/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos)
          });
        } else {
          response = await fetch(`${API_URL}/categorias`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos)
          });
        }
        const result = await response.json();
        if (result.success) {
          alert(result.message);
          bootstrap.Modal.getInstance(document.getElementById('modalCategoria')).hide();
          await cargarCategorias();
        } else {
          alert('Error: ' + result.message);
        }
      } catch (error) {
        alert('Error al conectar');
      }
    }

    async function eliminarCategoria(id) {
      const cat = categoriasGlobal.find(c => c.id === id);
      if (!cat) return;
      if (!confirm(`¿Eliminar la categoría "${cat.nombre}"?\n\n️ Se eliminarán también todas sus subcategorías.`)) return;
      
      try {
        const response = await fetch(`${API_URL}/categorias/${id}`, { method: 'DELETE' });
        const result = await response.json();
        if (result.success) {
          alert(result.message);
          await cargarCategorias();
        } else {
          alert('Error: ' + result.message);
        }
      } catch (error) {
        alert('Error al conectar');
      }
    }

    function abrirModalSubcategoria(categoriaId, categoriaNombre) {
      document.getElementById('formSubcategoria').reset();
      document.getElementById('subcategoriaId').value = '';
      document.getElementById('subcategoriaCategoriaId').value = categoriaId;
      document.getElementById('modalSubcategoriaTitulo').innerHTML = `<i class="bi bi-plus-lg"></i> Nueva Subcategoría para ${categoriaNombre}`;
      new bootstrap.Modal(document.getElementById('modalSubcategoria')).show();
    }

    function editarSubcategoria(id, nombre, icono) {
      const sub = categoriasGlobal.flatMap(c => c.subcategorias || []).find(s => s.id === id);
      if (!sub) return;
      document.getElementById('subcategoriaId').value = sub.id;
      document.getElementById('subcategoriaCategoriaId').value = ''; // No se puede cambiar de categoría
      document.getElementById('subcategoriaNombre').value = sub.nombre;
      document.getElementById('subcategoriaIcono').value = sub.icono || '';
      document.getElementById('modalSubcategoriaTitulo').innerHTML = '<i class="bi bi-pencil"></i> Editar Subcategoría';
      new bootstrap.Modal(document.getElementById('modalSubcategoria')).show();
    }

    async function guardarSubcategoria() {
      const id = document.getElementById('subcategoriaId').value;
      const categoria_id = document.getElementById('subcategoriaCategoriaId').value;
      const nombre = document.getElementById('subcategoriaNombre').value.trim();
      if (!nombre) { alert('El nombre es obligatorio'); return; }
      
      const datos = {
        nombre: nombre,
        categoria_id: categoria_id,
        icono: document.getElementById('subcategoriaIcono').value.trim()
      };

      try {
        let response;
        if (id) {
          response = await fetch(`${API_URL}/subcategorias/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos)
          });
        } else {
          response = await fetch(`${API_URL}/subcategorias`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos)
          });
        }
        const result = await response.json();
        if (result.success) {
          alert(result.message);
          bootstrap.Modal.getInstance(document.getElementById('modalSubcategoria')).hide();
          await cargarCategorias();
        } else {
          alert('Error: ' + result.message);
        }
      } catch (error) {
        alert('Error al conectar');
      }
    }

    async function eliminarSubcategoria(id) {
      const sub = categoriasGlobal.flatMap(c => c.subcategorias || []).find(s => s.id === id);
      if (!sub) return;
      if (!confirm(`¿Eliminar la subcategoría "${sub.nombre}"?`)) return;
      
      try {
        const response = await fetch(`${API_URL}/subcategorias/${id}`, { method: 'DELETE' });
        const result = await response.json();
        if (result.success) {
          alert(result.message);
          await cargarCategorias();
        } else {
          alert('Error: ' + result.message);
        }
      } catch (error) {
        alert('Error al conectar');
      }
    }
  </script>
</body>
</html>
